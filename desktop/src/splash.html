<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedLab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0B0D12;
      color: #F3F5F8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .logo-container {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #FF3B4E 0%, #b31424 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(255, 59, 78, 0.35);
      animation: pulse 2s infinite ease-in-out;
    }
    .logo-container svg {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #F3F5F8;
    }
    p {
      font-size: 13px;
      color: #9BA5B5;
    }
    .loader {
      width: 140px;
      height: 4px;
      background-color: #171C26;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    .loader-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #FF3B4E, #FF8A4C);
      border-radius: 2px;
      animation: indeterminate 1.5s infinite ease-in-out;
      transform-origin: 0% 50%;
    }
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 10px 30px rgba(255, 59, 78, 0.35);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 14px 40px rgba(255, 59, 78, 0.5);
      }
    }
    @keyframes indeterminate {
      0% {
        transform: translateX(-100%) scaleX(0.2);
      }
      50% {
        transform: translateX(0%) scaleX(0.7);
      }
      100% {
        transform: translateX(100%) scaleX(0.2);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <!-- Flame icon -->
      <svg viewBox="0 0 24 24">
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
      </svg>
    </div>
    <h1>RedLab</h1>
    <p>Starting visual cloud security engine...</p>
    <div class="loader">
      <div class="loader-bar"></div>
    </div>
  </div>
</body>
</html>
